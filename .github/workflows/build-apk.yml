name: Build ChatGPT Auto Continue APK

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :autocontinue:assembleDebug

      - name: Rename APK
        run: cp autocontinue/build/outputs/apk/debug/autocontinue-debug.apk ChatGPT-Auto-Continue-v2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Auto-Continue-v2.1
          path: ChatGPT-Auto-Continue-v2.1.apk
          if-no-files-found: error
          retention-days: 14

# synchronized v2.1 build trigger
