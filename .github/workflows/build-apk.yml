name: Build debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Claude review source
        run: |
          rm -rf claude-review
          mkdir -p claude-review
          cp -R app/src claude-review/app-src
          cp app/build.gradle.kts claude-review/app-build.gradle.kts
          cp build.gradle.kts settings.gradle.kts gradle.properties claude-review/
          cp .github/workflows/build-apk.yml claude-review/build-apk.yml
          cat > claude-review/CLAUDE_REVIEW_NOTES.md <<'EOF'
          # Zill OCR Overlay review package

          Review the current branch as an Android/Kotlin code review. Classify findings as **must fix / recommended / optional**.

          Please focus on issue #24 learning inbox:
          - multi-candidate speaker/OCR inbox dedupe and hit counts
          - no candidate Toast during gameplay
          - typed persistent ignore keys and provider-side filtering
          - candidate map size caps/eviction ordering
          - approve/edit/ignore flows in LearningManagerActivity
          - cache clearing must not erase the candidate inbox
          - region reset/service context clearing behavior
          - existing Room migrations/data preservation and translation behavior regressions
          EOF
          (cd claude-review && zip -qr ../ZillOcrOverlay-source-for-Claude.zip .)

      - name: Upload Claude review source
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-source-for-Claude
          path: ZillOcrOverlay-source-for-Claude.zip
          if-no-files-found: error
          retention-days: 14
