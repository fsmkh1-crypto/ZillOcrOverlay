name: Build debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'korean-patch-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout upstream Zill toolchain
        uses: actions/checkout@v4
        with:
          repository: HK47196/zill
          path: upstream-zill
          fetch-depth: 0

      - name: Analyze authenticated upstream font delta
        run: |
          python3 korean_patch/poc/analyze_font_zpatch.py \
            upstream-zill/release/font/font-zillfont.zpatch \
            --json font-zpatch-analysis.json
          python3 korean_patch/poc/render_font_delta_atlas.py \
            upstream-zill/release/font/font-zillfont.zpatch \
            --outdir font-delta-atlas \
            --json font-delta-atlas.json
          python3 korean_patch/poc/analyze_otf_cmap_mapping.py \
            upstream-zill/release/font/fs-tahoma-8px.otf \
            --json otf-cmap-mapping.json
          python3 korean_patch/poc/analyze_metric_slot_geometry.py \
            upstream-zill/release/font/metrics.toml \
            --json metric-slot-geometry.json
          echo '### zillfont XOR analysis' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat font-zpatch-analysis.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### OTF cmap / physical atlas diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat otf-cmap-mapping.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### 15x16 metric-slot geometry diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat metric-slot-geometry.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect upstream font history
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== commits touching release/font ==='
            git -C upstream-zill log --all --date=iso --pretty='format:%H %ad %s' -- release/font || true
            echo
            echo '=== name-status history for font paths ==='
            git -C upstream-zill log --all --name-status --pretty='format:COMMIT %H %s' -- '*font*' 'release/font/*' || true
            echo
            echo '=== commits mentioning zillfont ==='
            git -C upstream-zill log --all -S'zillfont' --date=iso --pretty='format:%H %ad %s' -- . || true
            echo
            echo '=== commits mentioning fs-tahoma-8px ==='
            git -C upstream-zill log --all -S'fs-tahoma-8px' --date=iso --pretty='format:%H %ad %s' -- . || true
            echo
            echo '=== deleted font-like files ==='
            git -C upstream-zill log --all --diff-filter=D --name-status --pretty='format:COMMIT %H %s' -- '*font*' || true
          } > upstream-font-history.txt
          sed -n '1,300p' upstream-font-history.txt

      - name: Upload font analysis
        uses: actions/upload-artifact@v4
        with:
          name: zillfont-zpatch-analysis
          path: |
            font-zpatch-analysis.json
            font-delta-atlas.json
            font-delta-atlas/
            upstream-font-history.txt
            otf-cmap-mapping.json
            metric-slot-geometry.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build OCR app and standalone patcher
        run: gradle --no-daemon --stacktrace :app:assembleDebug :patcher:assembleDebug

      - name: Upload OCR debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Korean patcher APK
        uses: actions/upload-artifact@v4
        with:
          name: ZillKoreanPatcher-debug
          path: patcher/build/outputs/apk/debug/patcher-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Claude review source
        run: |
          rm -rf claude-review
          mkdir -p claude-review
          cp -R app/src claude-review/app-src
          cp -R patcher/src claude-review/patcher-src
          cp -R korean_patch claude-review/korean-patch
          cp app/build.gradle.kts claude-review/app-build.gradle.kts
          cp patcher/build.gradle.kts claude-review/patcher-build.gradle.kts
          cp build.gradle.kts settings.gradle.kts gradle.properties claude-review/
          cp .github/workflows/build-apk.yml claude-review/build-apk.yml
          cat > claude-review/CLAUDE_REVIEW_NOTES.md <<'EOF'
          # Zill OCR Overlay + Korean patcher review package

          Review the current branch as an Android/Kotlin/Python code review. Classify findings as **must fix / recommended / optional**.

          Focus additionally on the standalone `patcher` module and Korean font PoC:
          - safe read-only ISO9660 traversal
          - PAA member 13611 extraction
          - ULJM05410 v1.03 zillfont.par SHA-256 validation
          - authenticated upstream zpatch reconstruction
          - PAR section parsing and conservative XOR pattern analysis
          - atlas/swizzle hypotheses must remain explicitly unproven until validated
          - no assumption that metrics numeric sort order equals physical glyph order
          - no modification/upload of the source ISO
          - separation from the OCR overlay application
          EOF
          (cd claude-review && zip -qr ../ZillOcrOverlay-source-for-Claude.zip .)

      - name: Upload Claude review source
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-source-for-Claude
          path: ZillOcrOverlay-source-for-Claude.zip
          if-no-files-found: error
          retention-days: 14
