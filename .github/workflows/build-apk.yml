name: Build debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply alpha8 UI review patch
        if: github.event_name == 'pull_request' && github.head_ref == 'stage10/feedback-learning-autoheight-alpha8'
        run: |
          python tools/apply_alpha8_ui_review.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/kr/co/zillocr/overlay/capture/ScreenOcrService.kt
            git commit -m "Apply reviewed alpha8 overlay controls"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Claude review source
        run: |
          rm -rf claude-review
          mkdir -p claude-review
          cp -R app/src claude-review/app-src
          cp app/build.gradle.kts claude-review/app-build.gradle.kts
          cp build.gradle.kts settings.gradle.kts gradle.properties claude-review/
          cp .github/workflows/build-apk.yml claude-review/build-apk.yml
          cat > claude-review/CLAUDE_REVIEW_NOTES.md <<'EOF'
          # Zill OCR Overlay review package

          Review the current branch as an Android/Kotlin code review. Classify findings as **must fix / recommended / optional**.

          Please focus on:
          - Room migrations and data preservation
          - approved speaker/OCR alias learning (no silent persistence)
          - translation override precedence over cache/AI
          - sticky speaker lifecycle and forced-retry behavior
          - in-flight request cancellation races
          - overlay auto-height and manual resize behavior
          - 5-button primary overlay bar and grouped settings/learning panel usability
          - persistent pending-candidate badge and confirmation-before-save safety
          - correction/approval dialog modality on TYPE_APPLICATION_OVERLAY
          - HTTP/API error handling
          EOF
          (cd claude-review && zip -qr ../ZillOcrOverlay-source-for-Claude.zip .)

      - name: Upload Claude review source
        uses: actions/upload-artifact@v4
        with:
          name: ZillOcrOverlay-source-for-Claude
          path: ZillOcrOverlay-source-for-Claude.zip
          if-no-files-found: error
          retention-days: 14
