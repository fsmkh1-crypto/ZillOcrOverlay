name: Apply alpha8.5 optimization patch

on:
  push:
    branches:
      - perf/ocr-http-cache-alpha8.5
    paths:
      - '.github/patches/alpha8.5.part*'
      - '.github/workflows/apply-alpha8.5.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ocr-http-cache-alpha8.5
          fetch-depth: 0

      - name: Assemble and apply patch
        run: |
          cat .github/patches/alpha8.5.part* > /tmp/alpha8.5.patch
          git apply --check /tmp/alpha8.5.patch
          git apply /tmp/alpha8.5.patch

      - name: Remove temporary patch helpers
        run: |
          rm -f .github/patches/alpha8.5.part*
          rm -f .github/workflows/apply-alpha8.5.yml

      - name: Commit optimized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize OCR gating, HTTP reuse, and GPT-5.6 prompt caching'
          git push origin HEAD:perf/ocr-http-cache-alpha8.5
